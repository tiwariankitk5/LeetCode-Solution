name: Update LeetCode stats

on:
  push:
    branches: [main]
    paths:
      - '**/README.md'
      - 'stats.json'
      - '.github/workflows/update-stats.yml'
      - '.github/scripts/update_stats.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leetcode-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recalculate difficulty totals
        run: python .github/scripts/update_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats.json
          git commit -m "chore: update LeetCode difficulty statistics"
          git push
